<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Tabular Data</title>
</head>

<body>
  
  <table>
    
    <thead>
      
      <tr>
        <th>Languages:</th>
        <th colspan="2">Study hours</th>

        <th>Subject</th>  
        <th>Beginner</th>

    </thead>
    
     <tbody>
       
    <tr>
       <td>Python</td>
       <td>2</td>
       <td>4</td>
    </tr>
    <tr>
       <td>HTML</td>
       <td>2</td>
       <td>3</td>
    </tr>
    <tr>
       <td>CSS</td>
       <td>3</td>
       <td>4</td>
    </tr>
    <tr>
      <td>JavaScript</td>
      <td>3</td>
      <td>6</td>
    </tr>
    <tr>
      <td>C++</td>
      <td>4</td>
      <td>7</td>
    </tr>
    
     </tbody>
    
    <tfoot>
      
    <tr>
      <td>Total</td>
      <td>14</td>
      <td>24</td>
    </tr>
      
    </tfoot>
    
  </table>
  
 </body>

</html>
