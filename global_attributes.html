<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Global Attributes</title>
</head>

<body>
  <!-- id: gives an element a unique identifier -->
  <h1 id="intro">Hello</h1>

  <!-- class: groups multiple elements -->
  <p class="paragraph">Hey, I'm Abax</p>
  <p class="paragraph">We are learning HTML</p>

  <!-- title: adds additional information -->
  <p title="This is additional information">This is additional information</p>

  <!-- style: adds inline CSS directly to an element -->
  <p style="color: blue;">Inline CSS</p>

  <!-- lang: specifies an element's content language -->
  <p lang="en">English</p>

  <!-- dir: sets the text direction -->
  <p dir="rtl">Right to left</p>

  <!-- hidden: hides an element -->
  <p hidden>It's hidden</p>

  <!-- accesskey: assigns a keyboard shortcut to an element -->
  <button accesskey="a">Save</button>

  <!-- contenteditable: makes an element editable by the user -->
  <p contenteditable="true">Edit this text</p>

  <!-- spellcheck: enables browser spelling checks -->
  <p contenteditable="true" spellcheck="true">Check my spelling</p>

  <!-- draggable: indicates whether an element can be dragged -->
  <p draggable="true">Drag this text</p>

  <!-- translate: controls whether translation tools should translate the content -->
  <p translate="yes">Translate me</p>

  <!-- data-*: stores custom data on an element -->
  <p data-name="abax">Abax</p>

  <!-- inert: makes an element and its content non-interactive -->
  <p inert>You can't interact with this</p>
</body>

</html>
