<!DOCTYPE html>
<html lang="en">

<head>
  <title>Global Attributes</title>
</head>


<body>
  
  <!-- id: give element an unique indentifier -->
  <h1 id="intro">Hello</h1>
  
  <!-- class: group multiple elements -->
  <p class="paragraph">Hay, Im Abax</p>
  <p class="paragraph">We are learning HTML</p>
  
  <!-- title: add additional information -->
  <p title="this is additional info">This is additional information</p>
  
  <!-- adds inline css directly to an element -->
  <p style="color: blue;">Inline CSS</p>
  
  <!-- specify element's content language-->
  <p lang="en">English</p>
</body>

<!--tells text direction-->
<p dir="rtl">Right to left</p>

<!-- hide an element-->
<p hidden>It's hidden</p>

<!-- assigns an keyboard shortcut to am element-->
<button accesskey="a">Save</button>

<!-- make an element editable by the user-->
<p contenteditable="true">Edit this text</p>

<!--browser checks spellings-->
<p contenteditable spellcheck="true">Check my spells</p>

<!--tells whether an element can be dragged-->
<p draggable>Drag this text</p>

<!-- controls whether the element’s content should be translated by translation tools/browser features-->
<p translate="true">Translate me</p>

<!-- store custom data on an element-->
<p data-name="abax">Abax</p>

<!-- make an element and its content non-interactive-->
<p inert>You can't interact with this</p>

</body>

</html>
