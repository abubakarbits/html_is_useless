<!DOCTYPE html>
<html lang="en">

<head>
  <title>Student Registration Form</title>
</head>

<body>
  
  <h1>Student Registration Form</h1>
  
  <form action="/register" method="post">
    
    <label for="name">Name:</label>
    <input type="text"
           id="name"
           name="name"
           minlength="3"
           maxlength="30"
           placeholder="Enter your name"
           required>
           
           <br><br>
           
    <label for="age">Age:</label>
    <input type="number"
           id="age"
           name="age"
           min="17"
           max="50"
           placeholder="Enter your age"
           required>
           
           <br><br>
           
    <label for="email">Email:</label>
    <input type="email"
           id="email"
           name="email"
           placeholder="Enter your email"
           required>
           
           <br><br>
           
    <label for="password">Password:</label>
    <input type="password"
           id="password"
           name="password"
           minlength="5"
           maxlength="30"
           placeholder="Enter your password"
           required>
           
          
          <br><br>
    <label>
      <input type="radio"
             name="gender"
             value="male"
             required>
             Male
    </label>
    
    <label>
      <input type="radio"
             name="gender"
             value="female"
             required>
             Female
    </label>
    
        <br><br>
    
    <label>
      <input type="checkbox"
            name="skill"
            value="HTML">
           HTML
    </label>
    
    <label>
    <input type="checkbox"
           name="skill"
           value="CSS">
           CSS
    </label>
    
    <label>
      <input type="checkbox"
             name="skill"
             value="JavaScript">
             JavaScript
    </label>
      
         <br><br>
      
      <label for="country">Select Country:</label>
      <select id="country" name="country">
        <option value="pakistan" selected>Pakistan</option>
        <option value="united kingdom">United Kingdom</option>
        <option value="turkey">Turkey</option>
        <option value="germany">Germany</option>
      </select>
      
      <br><br>
      
      <label for="message">Message:</label><br>
      <textarea
      id="message"
      name="message"
      rows="5"
      cols="10"
      maxlength="200"
      placeholder="Enter your message here">
      </textarea>
      
        <br><br>
         
     <button type="submit">Submit</button>
        
  </form>
  
  
  
 </body>

</html>
